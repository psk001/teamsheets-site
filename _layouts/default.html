<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}Teamsheets for Jira</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="icon" type="image/png" href="{{ '/assets/favicon.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header class="nav">
    <div class="wrap nav-inner">
      <a class="brand" href="{{ '/' | relative_url }}">
        <img src="{{ '/assets/icon.png' | relative_url }}" alt="" width="32" height="32"> Teamsheets
      </a>
      <nav>
        <a href="{{ '/#features' | relative_url }}">Features</a>
        <a href="{{ '/support' | relative_url }}">Support</a>
        <a href="{{ '/privacy' | relative_url }}">Privacy</a>
      </nav>
    </div>
  </header>
  {% if page.permalink == "/" or page.url == "/" %}
    {{ content }}
  {% else %}
    <main class="wrap doc">{{ content }}</main>
  {% endif %}
  <footer class="footer">
    <div class="wrap footer-inner">
      <span>© 2026 teamsheets</span>
      <span>
        <a href="{{ '/support' | relative_url }}">Support</a> ·
        <a href="{{ '/privacy' | relative_url }}">Privacy policy</a> ·
        <a href="mailto:support.teamsheet@gmail.com">support.teamsheet@gmail.com</a>
      </span>
    </div>
  </footer>
</body>
</html>
